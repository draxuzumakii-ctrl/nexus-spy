<!DOCTYPE html><html><head><meta charset="utf-8"><title>Nexus Console</title>
<style>body{background:#111;color:#e5e5e5;font-family:monospace;padding:20px}
input,button,textarea{background:#222;color:#e5e5e5;border:1px solid #444;padding:8px;margin:4px}
table{width:100%;border-collapse:collapse}td,th{border:1px solid #333;padding:6px;text-align:left}
</style></head><body>
<h2>Nexus Console</h2>
<input id="tok" placeholder="GitHub token" size="50"><br>
<button onclick="load()">Load Devices</button>
<div id="out"></div>
<script>
const OWNER="draxuzumakii-ctrl",REPO="nexus-spy",BR="main";
function tok(){return document.getElementById('tok').value||"ISI_TOKEN_DI_SINI";}
async function api(path,opt){opt=opt||{};opt.headers={"Authorization":"token "+tok(),"Accept":"application/vnd.github+json"};return fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+path+"?ref="+BR,opt);}
async function load(){const r=await api("data/devices.json");if(!r.ok){document.getElementById('out').innerText="err "+r.status;return;}
const j=await r.json();const d=JSON.parse(atob(j.content.replace(/\s/g,"")));
let h="<table><tr><th>ID</th><th>Name</th><th>Model</th><th>Active</th></tr>";
for(const k in d){h+="<tr><td>"+k+"</td><td>"+d[k].name+"</td><td>"+d[k].model+"</td><td>"+d[k].active+"</td></tr>";}
h+="</table>";document.getElementById('out').innerHTML=h;}
</script></body></html>
